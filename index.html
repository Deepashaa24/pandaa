<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Nunito:wght@400;600&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Page 1: the box -->
<main class="page on" id="p1">
  <h1 id="hello"></h1>
  <p class="soft">I made something for you</p>
  <button class="boxbtn" id="box" aria-label="Open the box">
    <svg viewBox="0 0 300 300" aria-hidden="true">
      <rect x="50" y="140" width="200" height="140" rx="22" fill="#fff" stroke="#3b2f33" stroke-width="3"/>
      <ellipse cx="112" cy="198" rx="16" ry="21" fill="#3b2f33" transform="rotate(-20 112 198)"/>
      <ellipse cx="188" cy="198" rx="16" ry="21" fill="#3b2f33" transform="rotate(20 188 198)"/>
      <circle cx="114" cy="196" r="5" fill="#fff"/><circle cx="186" cy="196" r="5" fill="#fff"/>
      <ellipse cx="150" cy="223" rx="9" ry="6" fill="#3b2f33"/>
      <path d="M137 236 Q150 247 163 236" fill="none" stroke="#3b2f33" stroke-width="3" stroke-linecap="round"/>
      <circle cx="88" cy="230" r="11" fill="#f4b6c4"/><circle cx="212" cy="230" r="11" fill="#f4b6c4"/>
      <g id="lid">
        <circle cx="78" cy="112" r="25" fill="#3b2f33"/><circle cx="222" cy="112" r="25" fill="#3b2f33"/>
        <rect x="38" y="104" width="224" height="48" rx="20" fill="#fff" stroke="#3b2f33" stroke-width="3"/>
        <path d="M150 136 c-12-12-26 2-12 12 l12 9 l12-9 c14-10 0-24-12-12z" fill="#f4b6c4" transform="translate(0 -13)"/>
      </g>
      <g id="note">
        <rect x="88" y="128" width="124" height="96" rx="10" fill="#fffaf8" stroke="#3b2f33" stroke-width="3"/>
        <path d="M88 134 L150 182 L212 134" fill="none" stroke="#3b2f33" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M150 192 c-8-9-19 1-9 9 l9 7 l9-7 c10-8-1-18-9-9z" fill="#e58fa3"/>
        <text x="150" y="120" text-anchor="middle" font-family="Caveat,cursive" font-size="26" font-weight="700" fill="#3b2f33">for you</text>
      </g>
    </svg>
  </button>
  <p class="hint">tap the box</p>
</main>

<!-- Page 2: letter, countdown, photo -->
<main class="page" id="p2">
  <div class="card">
    <h2 id="title"></h2>
    <p class="lbl" id="lbl"></p>
    <div class="count">
      <div><b id="d">0</b><small>days</small></div>
      <div><b id="h">0</b><small>hours</small></div>
      <div><b id="m">0</b><small>minutes</small></div>
      <div><b id="s">0</b><small>seconds</small></div>
    </div>

    <button class="photo" id="photoBtn" aria-label="Our photo">
      <div class="fr" id="fr">Tap to add our photo</div>
      <span id="cap"></span>
    </button>
    <input type="file" id="file" accept="image/*" hidden>

    <div class="letter" id="letter"><div class="greet" id="greet"></div></div>
    <p class="sign" id="sign"></p>

    <div class="actions">
      <button class="btn primary" id="next">One more surprise</button>
      <button class="btn ghost" id="back">Close the box</button>
    </div>
  </div>
</main>

<!-- Page 3: seven letters -->
<main class="page" id="p3">
  <div class="card">
    <h2 id="sTitle"></h2>
    <p class="lbl" id="sSub"></p>
    <div class="env-grid" id="envGrid"></div>
    <div class="actions">
      <button class="btn ghost" id="back2">Back to my letter</button>
    </div>
  </div>
</main>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="mcard">
    <div class="mtitle" id="mTitle"></div>
    <p class="mtext" id="mText"></p>
    <button class="btn primary" id="mClose">Close letter</button>
  </div>
</div>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
